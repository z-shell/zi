---
name: CodeQL

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]
  schedule:
    - cron: "28 15 * * 5"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    uses: z-shell/.github/.github/workflows/codeql.yml@6fac3d47a61b27db54e50a0519c1e79b2935eda4 # main
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
