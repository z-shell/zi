  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# The reusable workflow owns concurrency; a duplicate caller group can deadlock.
jobs:
  org-routing:
    name: Org Routing
    permissions:
      contents: read
    uses: z-shell/.github/.github/workflows/org-routing.yml@a07ed57c25d6489061c01bcae648e0d706b13371 # main
