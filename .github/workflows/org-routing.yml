---
name: Org Routing

# ADR-0031: verify generated routing and approved organization skills.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# The reusable workflow owns concurrency; a duplicate caller group can deadlock.
jobs:
  org-routing:
    name: Org Routing
    permissions:
      contents: read
    uses: z-shell/.github/.github/workflows/org-routing.yml@2c5906fe9ab3c5ad8333ca997665e2f86366a493 # main
