---
name: Promotion Readiness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  # The called ZD workflow uses the inherited workflow name and ref.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-caller
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zsh:
    name: Full Zsh validation
    uses: ./.github/workflows/zsh-n.yml
    with:
      candidate-ref: ${{ github.event.pull_request.head.sha || github.sha }}

  zd:
    name: ZD integration
    uses: z-shell/zd/.github/workflows/test-native.yml@5d160597c909a23f03b7a07ff9d43793a106f3e8 # z-shell/zd#123
    with:
      zi_repo: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      zi_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      include_compat: true

  trunk:
    name: Trunk
    permissions:
      contents: read
    uses: z-shell/.github/.github/workflows/trunk.yml@6fac3d47a61b27db54e50a0519c1e79b2935eda4 # main
    with:
      check-mode: all

  codeql:
    uses: z-shell/.github/.github/workflows/codeql.yml@6fac3d47a61b27db54e50a0519c1e79b2935eda4 # main
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    with:
      checkout-ref: ${{ github.event.pull_request.head.sha || github.sha }}

  clean-install:
    name: Clean install and startup
    runs-on: ubuntu-latest
    steps:
      - name: Install Zsh
        run: sudo apt-get update && sudo apt-get install -yq zsh

      - name: Install and start the exact candidate
        shell: bash
        env:
          CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          checkout="${RUNNER_TEMP}/zi-candidate"
          data_root="${RUNNER_TEMP}/zi-fresh-data"

          test ! -e "${checkout}"
          test ! -e "${data_root}"

          git init "${checkout}"
          git -C "${checkout}" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "${checkout}" fetch --no-tags --depth 1 origin -- \
            "${CANDIDATE_SHA}"
          git -C "${checkout}" checkout --detach FETCH_HEAD
          test "$(git -C "${checkout}" rev-parse HEAD)" = "${CANDIDATE_SHA}"

          mkdir -p \
            "${data_root}/home" \
            "${data_root}/cache" \
            "${data_root}/config"
          env \
            CANDIDATE_SHA="${CANDIDATE_SHA}" \
            HOME="${data_root}/home" \
            XDG_CACHE_HOME="${data_root}/cache" \
            XDG_CONFIG_HOME="${data_root}/config" \
            XDG_DATA_HOME="${data_root}/data" \
            ZDOTDIR="${data_root}/zdotdir" \
            ZI_CHECKOUT="${checkout}" \
            zsh -f <<'ZSH'
          builtin source "${ZI_CHECKOUT}/zi.zsh" || exit 1
          [[ ${ZI[BIN_DIR]} = ${ZI_CHECKOUT} ]] || exit 1
          [[ "$(git -C "${ZI[BIN_DIR]}" rev-parse HEAD)" = ${CANDIDATE_SHA} ]] ||
            exit 1
          (( ${+functions[zi]} )) || exit 1
          .zi-prepare-home || exit 1
          [[ ${ZI[HOME_DIR]} = ${XDG_DATA_HOME}/zi ]] || exit 1
          [[ ${ZI[CACHE_DIR]} = ${XDG_CACHE_HOME}/zi ]] || exit 1
          [[ ${ZI[CONFIG_DIR]} = ${XDG_CONFIG_HOME}/zi ]] || exit 1
          [[ -d ${ZI[HOME_DIR]} ]] || exit 1
          ZSH

  real-objects:
    name: Real objects install, update, unload, delete
    runs-on: ubuntu-latest
    steps:
      - name: Install Zsh
        run: sudo apt-get update && sudo apt-get install -yq zsh

      - name: Drive the exact candidate through real objects
        shell: bash
        env:
          CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          checkout="${RUNNER_TEMP}/zi-candidate-smoke"
          test ! -e "${checkout}"
          git init "${checkout}"
          git -C "${checkout}" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "${checkout}" fetch --no-tags --depth 1 origin -- \
            "${CANDIDATE_SHA}"
          git -C "${checkout}" checkout --detach FETCH_HEAD
          test "$(git -C "${checkout}" rev-parse HEAD)" = "${CANDIDATE_SHA}"
          # Network-dependent by design: the script installs, updates, unloads
          # and deletes real GitHub-hosted objects in an isolated home (#548).
          zsh -f "${checkout}/scripts/promotion-smoke.zsh" --checkout "${checkout}"

  gate:
    name: Promotion gate
    if: ${{ always() }}
    needs: [zsh, zd, trunk, codeql, clean-install, real-objects]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every stable qualification
        env:
          ZSH_RESULT: ${{ needs.zsh.result }}
          ZD_RESULT: ${{ needs.zd.result }}
          TRUNK_RESULT: ${{ needs.trunk.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          CLEAN_INSTALL_RESULT: ${{ needs.clean-install.result }}
          REAL_OBJECTS_RESULT: ${{ needs.real-objects.result }}
        run: |
          failed=0
          for result_name in \
            ZSH_RESULT \
            ZD_RESULT \
            TRUNK_RESULT \
            CODEQL_RESULT \
            CLEAN_INSTALL_RESULT \
            REAL_OBJECTS_RESULT
          do
            result="${!result_name}"
            if [[ "${result}" != success ]]; then
              echo "::error::${result_name} was '${result}', not 'success'."
              failed=1
            fi
          done
          exit "${failed}"
