---
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  manual:
    name: Verify and publish signed milestone
    if: github.event_name == 'push' && github.repository == 'z-shell/zi'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install Zsh
        run: sudo apt-get update && sudo apt-get install -yq zsh

      - name: Verify release authorization
        env:
          GH_TOKEN: ${{ github.token }}
        run: zsh -f scripts/verify-release-tag.zsh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          RELEASE_NOTES_FILE="${RUNNER_TEMP}/release-notes.md" RELEASE_EXCLUDE_TAG="$TAG" \
            zsh -f scripts/release-plan.zsh "${TAG}^{}" >> "$GITHUB_STEP_SUMMARY"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Zi $TAG" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --latest
