name: Promotion Issue Closure

# GitHub runs closing keywords only for pull requests into the default branch,
# so issues fixed on next stay open until their promotion reaches main. This
# closes the ones a promotion delivers; any other push to main is a no-op.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  close:
    name: Close Promoted Issues
    if: github.repository == 'z-shell/zi'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Check out the pushed main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Zsh and jq
        run: sudo apt-get update && sudo apt-get install -yq zsh jq

      - name: Close issues delivered by the promotion
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_SHA: ${{ github.sha }}
        run: zsh -f scripts/close-promoted-issues.zsh
