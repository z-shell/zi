---
name: ZD Integration

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# No pull_request trigger (#656): Promotion Readiness runs this check on every
# pull request into main through Promotion gate. The push run on main stays;
# scripts/verify-release-tag.zsh requires it before a milestone is published.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-caller
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zd-test:
    uses: z-shell/zd/.github/workflows/test-native.yml@5d160597c909a23f03b7a07ff9d43793a106f3e8 # z-shell/zd#123
    with:
      zi_repo: ${{ github.repository }}
      zi_ref: ${{ github.sha }}
      include_compat: false
