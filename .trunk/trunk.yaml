version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
lint:
  ignore:
    # Delivered copies of organization skills must stay byte-identical to
    # their canonical source (runbooks/org-review.md), so the proseWrap
    # setting from .prettierrc must not reflow them.
    - linters: [prettier]
      paths:
        - .github/skills/**
    # Vendored package manifests are verbatim upstream snapshots that
    # scripts/refresh-package-manifests.zsh re-fetches; reformatting them
    # would make every refresh a diff.
    - linters: [prettier]
      paths:
        - tests/fixtures/package-manifests/**
  definitions:
    # This repository is consumed as a submodule, so `.git` is a file whose
    # gitdir is relative to the superproject. Trunk's sandbox copy breaks that
    # relative path, so anchor the command at the real workspace.
    - name: git-diff-check
      commands:
        - name: lint
          run: git -C "${workspace}" diff --check ${target}
  enabled:
    - oxipng@9.1.5
    - trufflehog@3.90.13
    - actionlint@1.7.8
    - svgo@4.0.0
    - markdownlint@0.45.0
    - git-diff-check
    - prettier@3.6.2
    - shellcheck@0.11.0
    - shfmt@3.13.1
runtimes:
  enabled:
    - python@3.10.8
    - node@22.16.0
actions:
  enabled:
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
