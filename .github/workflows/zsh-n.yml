---
name: Zsh
on:
  push:
    tags: ["v*.*.*"]
    branches:
      - main
      - next
  pull_request:
    branches: [main, next]
  workflow_call:
    inputs:
      candidate-ref:
        description: Exact candidate commit for stable qualification.
        required: true
        type: string
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-zsh-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# One job runs the syntax pass, each matrix leg runs every focused test, and
# Zsh Gate reports both on every pull request so it can be a required check
# (#598). One job per file or per test spent 10-22 s installing Zsh to run a
# check that takes under a second, and queued about 126 jobs per run. Each
# test step keeps its own result and runs even after an earlier test fails; the
# tests isolate HOME and XDG state themselves. tests/ci-registration.zsh still
# requires every tests/*.zsh to be invoked by a step here.

jobs:
  syntax:
    name: Syntax and Compile
    uses: z-shell/.github/.github/workflows/zsh-ci.yml@6fac3d47a61b27db54e50a0519c1e79b2935eda4 # main
    with:
      checkout-ref: ${{ inputs.candidate-ref || github.sha }}
      require-sources: true
      run-zcompile: true
      extra-files: |
        lib/_zi
        lib/zcompile
        lib/templates/example-script

  tests:
    name: Focused Tests (${{ matrix.os }}, Zsh ${{ matrix.zsh }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        zsh: ["5.8.1", "5.9", "5.9.2"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate-ref || github.sha }}
      - name: Install exact Zsh
        uses: z-shell/.github/actions/setup-zsh@6fac3d47a61b27db54e50a0519c1e79b2935eda4 # main
        with:
          version: ${{ matrix.zsh }}
      - name: Install test tools and verify runtime
        id: install
        env:
          EXPECTED_ZSH: ${{ matrix.zsh }}
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -yq jq zip unzip groff
          else
            brew install jq groff
          fi
          zsh -f -c '[[ $ZSH_VERSION == "$EXPECTED_ZSH" ]]'
          zsh --version
      - name: Test unload ownership contracts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: zsh -f tests/unload-ownership-contracts.zsh
      - name: Test ownership across repeated loads of one plugin
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: zsh -f tests/repeated-load-ownership.zsh
      - name: Test unload hook dispatch
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: zsh -f tests/unload-hook-dispatch.zsh
      - name: Test the first pack install of a service profile
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: zsh -f tests/pack-service-first-install.zsh
      - name: Test that every vendored package manifest resolves through the reader
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: zsh -f tests/package-manifest-fixtures.zsh
      - name: Test that every focused test is registered here
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: zsh -f tests/ci-registration.zsh
      - name: Test public contract detector
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: zsh -f tests/public-contract-impact.zsh
      - name: Test release tag verification
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: zsh -f tests/release-tag-verification.zsh
      - name: Test main branch guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: zsh -f tests/main-branch-guard.zsh
      - name: Test release planning
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: zsh -f tests/release-plan.zsh
      - name: Test stable qualification gate
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: zsh -f tests/stable-qualification.zsh
      - name: Test promoted issue closure
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: zsh -f tests/promoted-issue-closure.zsh
      - name: Test the benchmark runner and comparer
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: zsh -f tests/benchmark-harness.zsh
      - name: Test version reporting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: zsh tests/version-reporting.zsh
      - name: Test the package manifest contract
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: zsh -f tests/package-manifest-contract.zsh
      - name: Test package manifest parsing
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: zsh -f tests/package-manifest-parsing.zsh
      - name: Test path resolution
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: zsh -f tests/path-resolution.zsh
      - name: Test disk ice resolution
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: zsh -f tests/disk-ice-resolution.zsh
      - name: Test gh-r musl detection
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: zsh -f tests/gh-r-musl-detection.zsh
      - name: Test parallel update
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: zsh -f tests/parallel-update.zsh
      - name: Test plugin autoload fpath scope
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: zsh -f tests/plugin-autoload-fpath-scope.zsh
      - name: Test autoload ice forms
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: zsh -f tests/plugin-autoload-ice.zsh
      - name: Test load object status
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: zsh -f tests/load-object-status.zsh
      - name: Test nested load state
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: zsh -f tests/nested-load-state.zsh
      - name: Test light tracking
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: zsh -f tests/light-tracking.zsh
      - name: Test load help
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: zsh -f tests/load-help.zsh
      - name: Test plugin autoload ownership
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: zsh -f tests/plugin-autoload-ownership.zsh
      - name: Test plugin standard callbacks
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: zsh -f tests/plugin-standard-callbacks.zsh
      - name: Test self-update reload
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: zsh -f tests/self-update-reload.zsh
      - name: Test scheduler idle behavior
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: zsh -f tests/scheduler-idle.zsh
      - name: Test annex unregister
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: zsh -f tests/annex-unregister.zsh
      - name: Test atinit deferred marker
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: zsh -f tests/atinit-deferred-marker.zsh
      - name: Test archive extraction
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: zsh tests/archive-extraction.zsh
      - name: Test completion refresh
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: zsh tests/completion-refresh.zsh
      - name: Test home preparation
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: zsh -f tests/home-preparation.zsh
      - name: Test hook ownership
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: zsh -f tests/hook-ownership.zsh
      - name: Test ice tokenizer
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: zsh -f tests/ice-tokenizer.zsh
      - name: Test message formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: zsh -f tests/message-formatting.zsh
      - name: Test source hygiene
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: zsh -f tests/source-hygiene.zsh
      - name: Test offline manual
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: zsh -f tests/manual.zsh
      - name: Test substitution nesting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: zsh -f tests/subst-nesting.zsh
      - name: Test snippet directory mirror
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: zsh -f tests/snippet-directory-mirror.zsh
      - name: Test snippet update status
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: zsh -f tests/snippet-update-status.zsh

  gate:
    name: Zsh Gate
    if: ${{ always() }}
    needs: [syntax, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require the syntax pass and every focused test
        env:
          SYNTAX_RESULT: ${{ needs.syntax.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          failed=0
          for result_name in SYNTAX_RESULT TESTS_RESULT; do
            result="${!result_name}"
            if [[ "${result}" != success ]]; then
              echo "::error::${result_name} was '${result}', not 'success'."
              failed=1
            fi
          done
          exit "${failed}"
