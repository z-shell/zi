---
name: Main Branch Source Guard

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    name: Guard main branch source
    runs-on: ubuntu-latest
    steps:
      # pull_request_target checks out the base branch, so the guard never
      # runs code from the pull request it is judging.
      - name: Check out trusted guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/main-branch-guard.zsh
          sparse-checkout-cone-mode: false

      - name: Set up Zsh
        uses: z-shell/.github/actions/setup-zsh@f30d6596347581e5a323aafb434a492769b983e2 # main

      - name: Verify pull request source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: zsh -f scripts/main-branch-guard.zsh
