---
name: Org Routing

# ADR-0031: verify generated routing and approved organization skills.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# The reusable workflow owns concurrency; a duplicate caller group can deadlock.
jobs:
  org-routing:
    name: Org Routing
    permissions:
      contents: read
    uses: z-shell/.github/.github/workflows/org-routing.yml@dc233851b57784314f99ce5099ea00fc05dc303d # main
