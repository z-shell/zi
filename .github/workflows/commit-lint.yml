---
name: Commit Lint

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main

# No concurrency group (#597). These jobs gate merges and finish in seconds.
# A push plus a pull-request edit fire two events for one head SHA, and any
# group cancels one of them (a running run with cancel-in-progress, a pending
# one without). The cancelled check runs for required contexts then kept a
# pull request blocked while the same contexts had passed (#594). Letting a
# superseded run finish costs seconds; a cancelled run can block a merge.

permissions:
  contents: read

jobs:
  policy:
    uses: z-shell/.github/.github/workflows/commit-lint.yml@6fac3d47a61b27db54e50a0519c1e79b2935eda4 # main
    permissions:
      contents: read
