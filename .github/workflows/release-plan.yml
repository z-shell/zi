---
name: Release Plan

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      candidate-sha:
        description: Full SHA of current main to review for a signed milestone.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  plan:
    name: Release plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.candidate-sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install Zsh
        run: sudo apt-get update && sudo apt-get install -yq zsh

      - name: Compute release plan
        id: release
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate-sha }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
          RELEASE_PLAN_OUTPUT: ${{ runner.temp }}/release-plan.env
          RELEASE_PLAN_BODY: ${{ runner.temp }}/release-plan.md
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
            test "$CANDIDATE_SHA" = "$(git rev-parse origin/main)"
          fi
          echo "Candidate: $CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
          zsh -f scripts/release-plan.zsh "$CANDIDATE_SHA" > "$RELEASE_PLAN_BODY"
          cat "$RELEASE_PLAN_BODY" >> "$GITHUB_STEP_SUMMARY"
          cat "$RELEASE_PLAN_OUTPUT" >> "$GITHUB_OUTPUT"

          echo 'This plan is read-only. Merging a PR does not authorize a tag or release; review the final main SHA and separately authorize its signed annotated tag.' >> "$GITHUB_STEP_SUMMARY"
