---
name: Trunk Code Quality
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch: {}

# No pull_request trigger (#656): Promotion Readiness runs this check on every
# pull request into main through Promotion gate. The push run on main stays;
# scripts/verify-release-tag.zsh requires it before a milestone is published.

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    permissions:
      contents: read
    uses: z-shell/.github/.github/workflows/trunk.yml@6fac3d47a61b27db54e50a0519c1e79b2935eda4 # main
    with:
      check-mode: all
